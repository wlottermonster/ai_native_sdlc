# AI-Native SDLC — the engine map. One file binds a ROLE to a MODEL, so the
# framework says "this is verification work" and this file decides what runs it.
#
# Format:   <role> = <model>[, <model>...]
#
#   * One entry per line. Whitespace around `=` and after each comma is
#     ignored.
#   * The FIRST model listed is the one that runs, and
#     the rest are the fallback chain, tried in order when the one before it
#     is unavailable.
#   * A line whose first non-blank character is `#` is a comment.
#   * Blank lines are ignored.
#   * Model names are passed through verbatim. Nothing validates them against a
#     catalogue, because the valid set changes with the plan and with releases:
#     a typo surfaces when the agent is dispatched, not when this file is saved.
#
# The roles:
#
#   judge     The main session: planning, gate decisions, review calls. Binds no
#             agent — the main session has no frontmatter to set — so this line
#             documents the intent and is read by the session, not written into
#             a file.
#   build     Implementation work: the implementer agent.
#   verify    Independent checking: spec review, verification, evidence
#             collection, UI walkthroughs, test audits.
#   read      Bulk reading, sweeping and summarising, where the cheap model is
#             enough and the volume is what costs.
#   escalate  Reserved for deliberate escalation — the model reached for when a
#             problem has beaten the working model. It is NEVER automatic:
#             nothing in the framework promotes work to it on its own, and it
#             binds no agent. The owner names it in the moment.
#
# To change the model the whole framework runs on, edit the three lines `judge`,
# `build` and `verify` to the new model name. That is the whole procedure: three
# lines, one model name each — `read` stays cheap and `escalate` stays reserved.
# Re-run `scripts/apply-engines.sh` afterwards so the installed agents pick the
# change up.

judge = opus, sonnet
build = opus, sonnet
verify = opus, sonnet
read = haiku, sonnet
escalate = fable, opus
