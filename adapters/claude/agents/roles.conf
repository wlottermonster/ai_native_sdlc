# AI-Native SDLC — the role manifest. Which ROLE each shipped agent runs under.
# The engine map (`sdlc-engines.conf`) then decides which model that role runs.
#
# Format:   <agent> = <role>
#
#   * <agent> is the basename of `agents/<agent>.md`.
#   * <role> is a role defined in the engine map.
#   * A line whose first non-blank character is `#` is a comment.
#   * Blank lines are ignored.
#
# `scripts/apply-engines.sh` reads this file plus the engine map and sets the
# `model:` line of each installed agent to the first model of its role. Adding
# an agent means adding a line here.
#
# `judge` and `escalate` appear in the engine map but never below: the judge is
# the main session, which has no frontmatter, and escalate is named by the owner
# in the moment rather than bound to an agent.

implementer = build

spec-reviewer = verify
verifier = verify
evidence = verify
ui-tester = verify
test-auditor = verify

researcher = read
